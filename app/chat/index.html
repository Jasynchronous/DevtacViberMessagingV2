<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title id="pageTitle">Devtac Messaging – Chat</title>
    <script src="https://js.zohostatic.com/support/developer_sdk/v1/js/ZohoDeskClientSDK.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="css/chat.css" />
</head>
<body>

    <!-- ── Header ── -->
    <div class="header">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="white">
                <path d="M12 2C6.48 2 2 5.94 2 10.8c0 2.6 1.3 4.94 3.36 6.55V21l3.1-1.7c1.11.31 2.3.48 3.54.48 5.52 0 10-3.94 10-8.98S17.52 2 12 2zm1.1 11.9l-2.55-2.7-4.98 2.7 5.48-5.82 2.6 2.7 4.93-2.7-5.48 5.82z"/>
            </svg>
        </div>
        <div class="header-text">
            <h1 id="widgetTitle">Devtac Viber</h1>
        </div>
        <div class="header-right">
            <div class="channel-pill">
                <div class="channel-pill-dot"></div>
                Viber
            </div>
            <div class="credit-badge" id="viberCreditBadge" title="Remaining Viber credits" style="display:none;">
                <span class="credit-badge-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                </span>
                <span class="credit-value">—</span> credits
            </div>
            <div class="devtac-badge">by <span class="dt">Devtac</span></div>
        </div>
    </div>

    <!-- ── Recipient bar ── -->
    <div class="recipient-bar">
        <div class="recipient-avatar" id="recipientAvatar">--</div>
        <div style="flex:1; min-width:0;">
            <div class="recipient-name" id="recipientName">Loading…</div>
            <div class="recipient-number" id="recipientNumber">—</div>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh messages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
        </button>
    </div>

    <!-- ── Conversation pane (messages + init overlay; header stays visible) ── -->
    <div class="conversation-pane">
        <div class="init-overlay" id="initOverlay">
            <div class="init-overlay-spinner"></div>
            <span class="init-overlay-label">Loading conversation…</span>
        </div>
        <div class="messages-area" id="messagesArea">
            <div id="historyHeader" class="history-header" style="display:none;"></div>
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
                </svg>
                <p id="emptyText">Select a template or type a message<br>to start the conversation.</p>
            </div>
        </div>
    </div>

    <!-- ── Compose area ── -->
    <div class="compose-area">

        <!-- Template panel -->
        <div class="tpl-panel" id="tplPanel">
            <div class="tpl-panel-header">
                <span class="tpl-panel-title">Templates</span>
                <button class="tpl-panel-close" id="tplPanelClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="tpl-search-wrap">
                <div class="tpl-search-inner">
                    <input type="text" class="tpl-search-input" id="tplSearch" placeholder="Search templates…" autocomplete="off" />
                    <span class="tpl-search-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="tpl-list" id="tplList">
                <div class="tpl-empty">Loading templates…</div>
            </div>
        </div>

        <!-- Input row -->
        <div class="input-row">
            <div class="left-col">
                <button class="tpl-trigger-btn" id="tplTriggerBtn" title="Insert template">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
                    </svg>
                    <span class="tpl-dot"></span>
                </button>
            </div>
            <div class="textarea-wrap">
                <textarea id="msgInput" placeholder="Type your message…" maxlength="1000" disabled></textarea>
                <span class="char-count" id="charCount">0/1000</span>
            </div>
            <div class="send-col">
                <button class="send-btn" id="sendBtn" disabled title="Send">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/chat-main.js"></script>
    <script type="module">
        import { CONFIG } from "../shared/js/config.js";
        document.getElementById("widgetTitle").textContent = CONFIG.WIDGET_NAME;
        document.getElementById("pageTitle").textContent   = CONFIG.WIDGET_NAME + " – Chat";
    </script>

</body>
</html>
